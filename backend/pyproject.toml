[project]
name = "moil-intelligence-backend"
version = "0.1.0"
description = "FastAPI backend for the MOIL Intelligence SIH 2026 project."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pytest",
    "httpx",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "geoalchemy2>=0.15,<1",
    "earthengine-api>=1,<2",
    "httplib2>=0.31,<1",
]

[project.optional-dependencies]
frontend = ["streamlit", "httpx", "pandas"]
test = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a migrated local PostgreSQL/PostGIS database"]
addopts = "-m 'not integration'"

[tool.setuptools.packages.find]
include = ["app*"]
